<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: #fef3c7;
            margin: 0;
            padding: 0;
        }
        header {
            background: #f97316;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 2rem;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .container {
            margin: 2rem;
            text-align: center;
        }
        .button {
            display: inline-block;
            background: #fb923c;
            color: white;
            padding: 1rem 2rem;
            margin: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background: #ea580c;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 2rem;
            border: 1px solid #888;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: #000;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        .list-item {
            background: #f9fafb;
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            text-align: left;
        }
        .message {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 6px;
            display: none;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
<header>
    <h1>Receptionist Dashboard</h1>
    <a href="/logout" class="logout-btn">Logout</a>
</header>
<div class="container">
    <button class="button" onclick="openManagePatients()">Manage Patients</button>
    <button class="button" onclick="openScheduleAppointment()">Schedule Appointment</button>
    <button class="button" onclick="openViewAppointments()">View Appointments</button>
</div>

<!-- Manage Patients Modal -->
<div id="patientsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('patientsModal')">&times;</span>
        <h2>Manage Patients</h2>
        <div id="patientMessage" class="message"></div>
        <form id="patientForm" onsubmit="savePatient(event)">
            <div class="form-group">
                <label>First Name:</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Phone Number:</label>
                <input type="text" id="phoneNumber" required>
            </div>
            <div class="form-group">
                <label>Date of Birth:</label>
                <input type="date" id="dateOfBirth" required>
            </div>
            <div class="form-group">
                <label>Gender:</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Blood Group:</label>
                <select id="bloodGroup">
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
            <div class="form-group">
                <label>Address:</label>
                <textarea id="address"></textarea>
            </div>
            <div class="form-group">
                <label>Emergency Contact Name:</label>
                <input type="text" id="emergencyContactName">
            </div>
            <div class="form-group">
                <label>Emergency Contact Phone:</label>
                <input type="text" id="emergencyContactPhone">
            </div>
            <button type="submit" class="button">Save Patient</button>
        </form>
        <div id="patientsList" style="margin-top: 2rem;"></div>
    </div>
</div>

<!-- Schedule Appointment Modal -->
<div id="appointmentModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('appointmentModal')">&times;</span>
        <h2>Schedule Appointment</h2>
        <div id="appointmentMessage" class="message"></div>
        <form id="appointmentForm" onsubmit="saveAppointment(event)">
            <div class="form-group">
                <label>Patient ID:</label>
                <input type="text" id="appPatientId" required>
            </div>
            <div class="form-group">
                <label>Doctor ID:</label>
                <input type="text" id="doctorId" required>
            </div>
            <div class="form-group">
                <label>Appointment Date:</label>
                <input type="date" id="appointmentDate" required>
            </div>
            <div class="form-group">
                <label>Appointment Time:</label>
                <input type="time" id="appointmentTime" required>
            </div>
            <div class="form-group">
                <label>Reason:</label>
                <textarea id="reason"></textarea>
            </div>
            <div class="form-group">
                <label>Notes:</label>
                <textarea id="notes"></textarea>
            </div>
            <button type="submit" class="button">Schedule Appointment</button>
        </form>
    </div>
</div>

<!-- View Appointments Modal -->
<div id="viewAppointmentsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('viewAppointmentsModal')">&times;</span>
        <h2>All Appointments</h2>
        <div id="appointmentsList"></div>
    </div>
</div>

<script>
    const API_BASE = '/alpha';

    function openManagePatients() {
        document.getElementById('patientsModal').style.display = 'block';
        loadPatients();
    }

    function openScheduleAppointment() {
        document.getElementById('appointmentModal').style.display = 'block';
    }

    function openViewAppointments() {
        document.getElementById('viewAppointmentsModal').style.display = 'block';
        loadAllAppointments();
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    window.onclick = function(event) {
        const modals = document.querySelectorAll('.modal');
        modals.forEach(modal => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    }

    async function savePatient(event) {
        event.preventDefault();
        const patient = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            dateOfBirth: document.getElementById('dateOfBirth').value,
            gender: document.getElementById('gender').value,
            bloodGroup: document.getElementById('bloodGroup').value,
            address: document.getElementById('address').value,
            emergencyContactName: document.getElementById('emergencyContactName').value,
            emergencyContactPhone: document.getElementById('emergencyContactPhone').value
        };

        try {
            const response = await fetch(`${API_BASE}/patient`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(patient)
            });
            const result = await response.text();
            showMessage('patientMessage', result, response.ok ? 'success' : 'error');
            if (response.ok) {
                document.getElementById('patientForm').reset();
                loadPatients();
            }
        } catch (error) {
            showMessage('patientMessage', 'Error: ' + error.message, 'error');
        }
    }

    async function loadPatients() {
        try {
            const response = await fetch(`${API_BASE}/patient`);
            const patients = await response.json();
            const patientsList = document.getElementById('patientsList');
            patientsList.innerHTML = '<h3>All Patients:</h3>';
            patients.forEach(patient => {
                const patientDiv = document.createElement('div');
                patientDiv.className = 'list-item';
                patientDiv.innerHTML = `
                    <p><strong>${patient.firstName} ${patient.lastName}</strong> - ${patient.email} - ${patient.phoneNumber}</p>
                `;
                patientsList.appendChild(patientDiv);
            });
        } catch (error) {
            console.error('Error loading patients:', error);
        }
    }

    async function saveAppointment(event) {
        event.preventDefault();
        const appointment = {
            patientId: document.getElementById('appPatientId').value,
            doctorId: document.getElementById('doctorId').value,
            appointmentDate: document.getElementById('appointmentDate').value,
            appointmentTime: document.getElementById('appointmentTime').value,
            reason: document.getElementById('reason').value,
            notes: document.getElementById('notes').value,
            status: 'SCHEDULED'
        };

        try {
            const response = await fetch(`${API_BASE}/appointment`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(appointment)
            });
            const result = await response.text();
            showMessage('appointmentMessage', result, response.ok ? 'success' : 'error');
            if (response.ok) {
                document.getElementById('appointmentForm').reset();
            }
        } catch (error) {
            showMessage('appointmentMessage', 'Error: ' + error.message, 'error');
        }
    }

    async function loadAllAppointments() {
        try {
            const response = await fetch(`${API_BASE}/appointment`);
            const appointments = await response.json();
            const appointmentsList = document.getElementById('appointmentsList');
            appointmentsList.innerHTML = '';
            if (appointments.length === 0) {
                appointmentsList.innerHTML = '<p>No appointments found.</p>';
                return;
            }
            appointments.forEach(appointment => {
                const appointmentDiv = document.createElement('div');
                appointmentDiv.className = 'list-item';
                const date = new Date(appointment.appointmentDate).toLocaleDateString();
                appointmentDiv.innerHTML = `
                    <h3>Appointment</h3>
                    <p><strong>Patient ID:</strong> ${appointment.patientId}</p>
                    <p><strong>Doctor ID:</strong> ${appointment.doctorId}</p>
                    <p><strong>Date:</strong> ${date}</p>
                    <p><strong>Time:</strong> ${appointment.appointmentTime}</p>
                    <p><strong>Status:</strong> ${appointment.status}</p>
                `;
                appointmentsList.appendChild(appointmentDiv);
            });
        } catch (error) {
            console.error('Error loading appointments:', error);
        }
    }

    function showMessage(elementId, message, type) {
        const messageDiv = document.getElementById(elementId);
        messageDiv.textContent = message;
        messageDiv.className = `message ${type}`;
        messageDiv.style.display = 'block';
        setTimeout(() => {
            messageDiv.style.display = 'none';
        }, 5000);
    }
</script>
</body>
</html>
